<!DOCTYPE html>
<html lang="en">
<head>
<script src="answeros-initial-data.js"></script>
<script src="answeros-data.js"></script>
<meta charset="UTF-8" />
<title>AnswerOS — All Answers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --green-900:#14532d;
    --green-800:#1c5c30;
    --green-700:#1f7a3d;
    --green-600:#2c8a46;
    --green-100:#e6f4ea;
    --green-50:#f3faf5;
    --ink-900:#14171a;
    --ink-700:#3c4247;
    --ink-500:#6b7278;
    --ink-300:#a2a8ad;
    --line:#e7eae8;
    --bg:#f6f8f6;
    --card:#ffffff;
    --red:#b3402c;
    --red-50:#fbf1ee;
    --amber:#c98a1f;
    --amber-50:#fbf5e8;
    --blue:#3b6fd5;
    --purple:#7a4fd5;
    --shadow: 0 1px 2px rgba(20,23,26,0.04), 0 6px 20px rgba(20,23,26,0.05);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink-900);
    font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Source Serif 4",Georgia,serif;}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;min-width:1180px;}

  /* ---------- Sidebar (shared) ---------- */
  .sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px 8px;}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,var(--green-600),var(--green-900));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:var(--shadow);}
  .brand-text .name{font-weight:700;font-size:15px;letter-spacing:-0.02em;color:var(--ink-900);line-height:1.1;}
  .brand-text .sub{font-size:11px;color:var(--ink-500);margin-top:2px;}
  nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink-700);font-size:13.5px;font-weight:500;cursor:pointer;user-select:none;transition:background .12s ease,color .12s ease;}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75;}
  .nav-item:hover{background:var(--green-50);color:var(--green-800);}
  .nav-item.active{background:var(--green-100);color:var(--green-800);font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-spacer{flex:1;}
  .side-foot{border-top:1px solid var(--line);padding-top:14px;margin-top:10px;}
  .user-row{display:flex;align-items:center;gap:10px;padding:6px 8px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#f0b7c4,#e08fa6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
  .user-row .uname{font-weight:600;font-size:12.5px;color:var(--ink-900);}
  .user-row .urole{font-size:11px;color:var(--ink-500);}
  .quote-card{margin-top:12px;background:var(--green-900);color:#e9f5ec;border-radius:12px;padding:14px;font-size:12px;line-height:1.55;}
  .quote-card .mark{font-size:20px;opacity:.5;line-height:0;display:block;margin-bottom:2px;}
  .quote-card .attrib{margin-top:8px;font-size:10.5px;color:#a9d3b4;}

  /* ---------- Main ---------- */
  main{padding:22px 30px 60px 30px;max-width:2200px;}
  .refresh-btn{display:flex;align-items:center;gap:7px;background:var(--green-800);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:var(--shadow);transition:background .12s ease;}
  .refresh-btn:hover{background:var(--green-900);}
  .refresh-btn svg{width:14px;height:14px;}
  .refresh-btn.spinning svg{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .refresh-toast{position:fixed;top:20px;right:24px;background:var(--ink-900);color:#fff;font-size:12.5px;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(-8px);transition:all .2s ease;pointer-events:none;z-index:50;max-width:280px;line-height:1.5;}
  .refresh-toast.show{opacity:1;transform:translateY(0);}
  .sync-panel{display:grid;grid-template-columns:1.3fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;}
  .sync-col{padding:16px 20px;}
  .sync-col:first-child{border-right:1px solid var(--line);}
  .sync-title{font-size:12.5px;font-weight:700;margin-bottom:6px;}
  .sync-desc{font-size:11.5px;color:var(--ink-500);line-height:1.55;margin-bottom:12px;}
  .sync-row{display:flex;gap:8px;}
  .sync-row input{flex:1;padding:8px 11px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-family:inherit;outline:none;}
  .sync-row input:focus{border-color:var(--green-600);box-shadow:0 0 0 3px var(--green-100);}
  .sync-row button, .copy-prompt-btn{background:var(--green-800);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .sync-row button:hover, .copy-prompt-btn:hover{background:var(--green-900);}
  .sync-status{margin-top:9px;font-size:11.5px;color:var(--ink-500);line-height:1.5;}
  .sync-status.error{color:var(--red);}
  .sync-status.ok{color:var(--green-700);}

  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;}
  .pagehead h1{font-size:22px;margin:0 0 4px 0;letter-spacing:-0.02em;}
  .pagehead p{margin:0;color:var(--ink-500);font-size:12.5px;}

  .ministat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .ministat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 16px;box-shadow:var(--shadow);min-width:120px;}
  .ministat .mv{font-size:18px;font-weight:800;letter-spacing:-0.02em;}
  .ministat .ml{font-size:10.5px;color:var(--ink-500);margin-top:1px;}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;}
  .search-wrap{position:relative;flex:1;min-width:220px;max-width:340px;}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-300);}
  .search-wrap input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-family:inherit;outline:none;}
  .search-wrap input:focus{border-color:var(--green-600);box-shadow:0 0 0 3px var(--green-100);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-700);cursor:pointer;transition:all .12s ease;user-select:none;}
  .chip:hover{border-color:var(--green-600);}
  .chip.active{background:var(--green-800);border-color:var(--green-800);color:#fff;}
  .toolbar-spacer{flex:1;}
  select.sortsel{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-family:inherit;color:var(--ink-700);cursor:pointer;outline:none;}

  #list{display:flex;flex-direction:column;gap:12px;}
  .acard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .arow{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;}
  .arow:hover{background:var(--green-50);}
  .ptag{font-size:11px;font-weight:800;border-radius:7px;padding:5px 10px;flex-shrink:0;width:38px;text-align:center;}
  .arow-main{flex:1;min-width:0;}
  .arow-title{font-size:13.5px;font-weight:700;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .arow-sub{font-size:11.5px;color:var(--ink-500);margin-top:2px;display:flex;gap:8px;align-items:center;}
  .arow-sub .sep{color:var(--ink-300);}
  .demandmini{width:70px;flex-shrink:0;}
  .demandmini .bar{height:5px;border-radius:4px;background:#eef1ee;overflow:hidden;}
  .demandmini .bar>div{height:100%;border-radius:4px;}
  .demandmini .pct{font-size:10px;color:var(--ink-500);margin-top:3px;text-align:center;}
  .scorebadge{flex-shrink:0;width:58px;text-align:center;padding:6px 0;border-radius:9px;font-weight:800;font-size:14px;}
  .medal-mini{width:22px;height:22px;border-radius:50%;overflow:hidden;flex-shrink:0;}
  .medal-mini img{width:100%;height:100%;object-fit:cover;display:block;}
  .scorebadge .of10{font-size:9.5px;font-weight:600;opacity:.7;display:block;margin-top:-1px;}
  .chev{color:var(--ink-300);transition:transform .18s ease;flex-shrink:0;}
  .acard.open .chev{transform:rotate(90deg);}

  .adetail{max-height:0;overflow:hidden;transition:max-height .25s ease;border-top:1px solid var(--line);}
  .acard.open .adetail{max-height:none;}
  .adetail-inner{display:grid;grid-template-columns:34px 1fr;}
  .adetail-inner.has-pdf{grid-template-columns:34px 1fr 6px var(--pdf-panel-width, 400px);}
  .adetail-resizer{cursor:col-resize;background:var(--line);position:relative;}
  .adetail-resizer:hover, .adetail-resizer.dragging{background:var(--green-600);}
  .adetail-resizer::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:32px;border-radius:2px;background:rgba(255,255,255,.7);}
  .rail{background:var(--green-50);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:0;position:relative;}
  .rail .tick{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;margin-bottom:22px;flex-shrink:0;position:relative;z-index:1;}
  .rail::before{content:'';position:absolute;top:30px;bottom:30px;left:50%;width:2px;background:var(--line);transform:translateX(-50%);z-index:0;}
  .tick.done{background:var(--green-600);color:#fff;}
  .tick.partial{background:var(--amber);color:#fff;}
  .tick.missing{background:var(--red);color:#fff;}

  .adetail-pdf{border-left:1px solid var(--line);background:#eef1ee;position:sticky;top:0;align-self:stretch;display:flex;flex-direction:column;min-height:500px;}
  .adetail-pdf-head{padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .adetail-pdf-head a{color:var(--green-700);text-decoration:none;font-weight:700;text-transform:none;letter-spacing:0;font-size:11px;}
  .adetail-pdf-head a:hover{text-decoration:underline;}
  .adetail-pdf iframe{flex:1;width:100%;border:none;min-height:460px;}
  .adetail-pdf-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-500);font-size:12px;text-align:center;padding:0 20px;}

  .adetail-body{padding:20px 26px 26px 22px;}
  .question-block{margin-bottom:18px;}
  .question-block .qlabel{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--green-700);margin-bottom:6px;}
  .question-text{font-size:16px;line-height:1.55;color:var(--ink-900);max-width:880px;}
  .demand-list{margin-top:14px;display:flex;flex-direction:column;gap:7px;}
  .structure-block{margin-top:16px;background:#fbfbf9;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .structure-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .structure-head .st-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);}
  .structure-head .sample-tag{font-size:9px;font-weight:700;color:#8a6212;background:var(--amber-50);border:1px solid #e7dcc0;padding:2px 7px;border-radius:5px;}
  .subhead-chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
  .subhead-chip{display:flex;align-items:center;gap:6px;background:var(--green-100);color:var(--green-800);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:20px;}
  .subhead-chip .snum{width:16px;height:16px;border-radius:50%;background:var(--green-700);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .subhead-arrow{color:var(--ink-300);font-size:12px;}
  .musthave-list{display:flex;flex-direction:column;gap:7px;}
  .musthave-item{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.5;color:var(--ink-700);}
  .musthave-item .mh-box{width:14px;height:14px;border:2px solid var(--green-600);border-radius:4px;flex-shrink:0;margin-top:2px;}
  .demand-item{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink-700);line-height:1.4;}
  .demand-item .di-ic{flex-shrink:0;margin-top:1px;}
  .demand-item.missing{color:var(--red);}
  .demand-item.partial{color:#8a6212;}

  .section{margin-top:22px;}
  .section-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);margin-bottom:8px;}
  .callout{background:var(--green-50);border-left:3px solid var(--green-600);border-radius:0 8px 8px 0;padding:12px 16px;font-size:14px;line-height:1.6;color:var(--ink-900);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;}
  .bullet-list{display:flex;flex-direction:column;gap:9px;}
  .bullet-list li{font-size:12.5px;line-height:1.55;color:var(--ink-700);list-style:none;padding-left:14px;position:relative;}
  .bullet-list li::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--green-600);}
  .bullet-list b{color:var(--ink-900);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .kw-chip{background:#eef3ee;color:var(--green-800);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;}

  .ink-note{background:var(--red-50);border:1px dashed #e3b3a5;border-radius:10px;padding:14px 16px;margin-top:10px;}
  .ink-note .in-row{display:flex;gap:10px;font-size:12.5px;line-height:1.55;margin-bottom:8px;}
  .ink-note .in-row:last-child{margin-bottom:0;}
  .ink-note .strike{color:var(--red);font-weight:600;text-decoration:line-through;text-decoration-color:#e3b3a5;flex-shrink:0;}
  .ink-note .arrow-fix{color:var(--green-800);}

  .feedback-box{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:10px;}
  .fb-cell{background:#fbfbf9;border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
  .fb-cell .fb-k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .fb-cell.strength .fb-k{color:var(--green-700);}
  .fb-cell.gap .fb-k{color:var(--red);}
  .fb-cell.fix .fb-k{color:var(--blue);}
  .fb-cell .fb-v{font-size:12px;color:var(--ink-700);line-height:1.4;}

  .learning-pill{margin-top:18px;background:linear-gradient(120deg,var(--green-900),var(--green-800));color:#eaf6ee;border-radius:12px;padding:14px 18px;font-size:13px;line-height:1.55;display:flex;gap:10px;align-items:flex-start;}
  .learning-pill svg{flex-shrink:0;width:17px;height:17px;margin-top:2px;color:#bfe6cb;}

  .topper-edge{margin-top:18px;}
  .topper-edge .tebox{border:1px solid #e7dcc0;background:var(--amber-50);border-radius:10px;padding:12px 15px;font-size:12.5px;line-height:1.55;color:#5c470f;}

  .afooter{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);}
  .afooter .pdfmeta{font-size:11px;color:var(--ink-500);}
  .status-chip{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--green-100);color:var(--green-800);}

  .empty-state{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:50px 20px;text-align:center;color:var(--ink-500);font-size:13px;}
  .empty-state .es-ic{width:34px;height:34px;color:var(--ink-300);margin:0 auto 10px auto;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d7dcd8;border-radius:8px;}
  @media (max-width:1400px){ .grid2{grid-template-columns:1fr;} .feedback-box{grid-template-columns:1fr;} .adetail-inner.has-pdf{grid-template-columns:34px 1fr;} .adetail-resizer{display:none;} .adetail-pdf{grid-column:1/-1;position:static;min-height:420px;border-left:none;border-top:1px solid var(--line);} }
  /* On wide viewports there's room to default the PDF panel wider instead of leaving
     it fixed while the feedback column stretches unused width. Still fully draggable
     from there via the resizer handle — this only sets the starting point. */
  @media (min-width:1900px){ :root{ --pdf-panel-width: 520px; } }

</style>
</head>
<body>
<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🌱</div>
      <div class="brand-text"><div class="name">AnswerOS</div><div class="sub">Answer Writing Tracker</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="nav-spacer"></div>
    <div class="side-foot">
      <div class="user-row">
        <div class="avatar">AP</div>
        <div><div class="uname">Aishwary Patil</div><div class="urole">UPSC Aspirant 🎯</div></div>
      </div>
      <div class="quote-card">
        <span class="mark">"</span>
        Discipline today shapes the freedom of your future.
        <div class="attrib">— Your Future Self</div>
      </div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main>
    <div class="pagehead">
      <div>
        <h1>All Answers</h1>
        <p id="syncNote">Synced from your Mains Tracker sheet</p>
      </div>
    </div>

    <div class="ministat-row" id="ministats"></div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchBox" placeholder="Search subtopic, subject or question…" />
      </div>
      <div class="chips" id="paperChips"></div>
      <select class="sortsel" id="subjectFilter">
        <option value="All">All Topics</option>
      </select>
      <select class="sortsel" id="subtopicFilterAA">
        <option value="All">All Subtopics</option>
      </select>
      <div class="toolbar-spacer"></div>
      <select class="sortsel" id="sortSel">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="score-desc">Highest score</option>
        <option value="score-asc">Lowest score</option>
        <option value="demand-asc">Lowest demand addressed</option>
      </select>
    </div>

    <div id="list"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <svg class="es-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      No answers match this search or filter. Try a different subject or clear the search.
    </div>
  </main>
</div>

<script>
/* ============================================================
   REAL DATA — transcribed directly from the user's Mains Tracker
   Google Sheet (spreadsheet 1DXc1U3jg...). 12 answers.
============================================================ */

function tierOf(a){
  const topperBar = a.max===10 ? 6 : a.max===15 ? 8 : a.max*0.53;
  if(a.marks >= topperBar) return TIERS[0];
  const pct = a.marks/a.max*100;
  return TIERS.slice(1).find(t=> pct >= t.min) || TIERS[TIERS.length-1];
}

/* ---------- filter chips ---------- */
const papersPresent = [...new Set(ANSWERS.map(a=>a.paper))];
let activePaper = 'All';
document.getElementById('paperChips').innerHTML = ['All', ...papersPresent].map(p=>
  `<div class="chip ${p==='All'?'active':''}" data-paper="${p}">${p}</div>`
).join('');
document.getElementById('paperChips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  activePaper = chip.dataset.paper;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c===chip));
  activeSubject = 'All'; activeSubtopic = 'All'; // paper change resets the narrower filters beneath it
  populateSubjectFilter(); populateSubtopicFilterAA();
  render();
});

/* ---------- topic (subject) + subtopic filters, cascading: paper → subject → subtopic ---------- */
let activeSubject = 'All';
let activeSubtopic = 'All';
function populateSubjectFilter(){
  const pool = activePaper==='All' ? ANSWERS : ANSWERS.filter(a=>a.paper===activePaper);
  const counts = {};
  pool.forEach(a=>{ if(a.subject) counts[a.subject] = (counts[a.subject]||0)+1; });
  const subjects = Object.keys(counts).sort((a,b)=> counts[b]-counts[a] || a.localeCompare(b));
  const sel = document.getElementById('subjectFilter');
  const keep = subjects.includes(activeSubject) ? activeSubject : 'All';
  sel.innerHTML = `<option value="All">All Topics</option>` + subjects.map(s=>`<option value="${s.replace(/"/g,'&quot;')}" ${s===keep?'selected':''}>${s} (${counts[s]})</option>`).join('');
  activeSubject = keep;
}
function populateSubtopicFilterAA(){
  let pool = activePaper==='All' ? ANSWERS : ANSWERS.filter(a=>a.paper===activePaper);
  if(activeSubject!=='All') pool = pool.filter(a=>a.subject===activeSubject);
  const counts = {};
  pool.forEach(a=>{ counts[a.subtopic] = (counts[a.subtopic]||0)+1; });
  const subtopics = Object.keys(counts).sort((a,b)=> counts[b]-counts[a] || a.localeCompare(b));
  const sel = document.getElementById('subtopicFilterAA');
  const keep = subtopics.includes(activeSubtopic) ? activeSubtopic : 'All';
  sel.innerHTML = `<option value="All">All Subtopics</option>` + subtopics.map(s=>`<option value="${s.replace(/"/g,'&quot;')}" ${s===keep?'selected':''}>${s} (${counts[s]})</option>`).join('');
  activeSubtopic = keep;
}
populateSubjectFilter();
populateSubtopicFilterAA();
document.getElementById('subjectFilter').addEventListener('change', e=>{
  activeSubject = e.target.value; activeSubtopic = 'All';
  populateSubtopicFilterAA();
  render();
});
document.getElementById('subtopicFilterAA').addEventListener('change', e=>{
  activeSubtopic = e.target.value;
  render();
});

/* ---------- search + sort state ---------- */
let searchTerm = '';
document.getElementById('searchBox').addEventListener('input', e=>{ searchTerm = e.target.value.toLowerCase(); render(); });
document.getElementById('sortSel').addEventListener('change', render);

const openIds = new Set();
// Deep-link support: ?open=<answer id> — used by Learnings' "View Full Answer" links
// so a Learning snippet can jump straight to its source answer, expanded and scrolled into view.
const deepLinkId = new URLSearchParams(location.search).get('open');
if(deepLinkId) openIds.add(deepLinkId);

function scoreOf(a){ return a.marks/a.max*10; }

function render(){
  let rows = ANSWERS.filter(a=>{
    if(activePaper!=='All' && a.paper!==activePaper) return false;
    if(activeSubject!=='All' && a.subject!==activeSubject) return false;
    if(activeSubtopic!=='All' && a.subtopic!==activeSubtopic) return false;
    if(searchTerm){
      const hay = (a.subtopic+' '+a.subject+' '+a.question).toLowerCase();
      if(!hay.includes(searchTerm)) return false;
    }
    return true;
  });
  const sortVal = document.getElementById('sortSel').value;
  rows = rows.slice().sort((a,b)=>{
    if(sortVal==='date-desc') return new Date(b.date)-new Date(a.date);
    if(sortVal==='date-asc') return new Date(a.date)-new Date(b.date);
    if(sortVal==='score-desc') return scoreOf(b)-scoreOf(a);
    if(sortVal==='score-asc') return scoreOf(a)-scoreOf(b);
    if(sortVal==='demand-asc') return a.demandPct-b.demandPct;
    return 0;
  });

  renderMiniStats(rows.length);

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('emptyState');
  if(rows.length===0){ listEl.innerHTML=''; emptyEl.style.display='block'; return; }
  emptyEl.style.display='none';

  listEl.innerHTML = rows.map((a,idx)=>{
    const id = a.date+'_'+idx;
    const col = PAPER_COLORS[a.paper]||'#888';
    const score = scoreOf(a);
    const scoreColor = score>=6.5?'#1c5c30':score>=4.5?'#8a6212':'#b3402c';
    const scoreBg = score>=6.5?'#e6f4ea':score>=4.5?'#fbf5e8':'#fbf1ee';
    const isOpen = openIds.has(id);
    const d = new Date(a.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

    const demandListHtml = a.demand.map(di=>{
      const icon = di.status==='done'?'✓':di.status==='partial'?'!':'✕';
      return `<div class="demand-item ${di.status}"><span class="di-ic">${icon}</span><span>${di.text}</span></div>`;
    }).join('');

    const structureHtml = (a.idealSubheadings && a.mustHavePoints) ? `
      <div class="structure-block">
        <div class="structure-head"><span class="st-label">Ideal Subheadings</span><span class="sample-tag">Sample — pending reprocessed sheet</span></div>
        <div class="subhead-chip-row">
          ${a.idealSubheadings.map((s,i)=>`<span class="subhead-chip"><span class="snum">${i+1}</span>${s}</span>${i<a.idealSubheadings.length-1?'<span class="subhead-arrow">→</span>':''}`).join('')}
        </div>
        <div class="structure-head"><span class="st-label">Must-Have Points</span></div>
        <div class="musthave-list">
          ${a.mustHavePoints.map(p=>`<div class="musthave-item"><span class="mh-box"></span><span>${p}</span></div>`).join('')}
        </div>
      </div>` : '';

    const railTicks = a.demand.map(di=>{
      const icon = di.status==='done'?'✓':di.status==='partial'?'!':'✕';
      return `<div class="tick ${di.status}" title="${di.status}">${icon}</div>`;
    }).join('');

    const detailHtml = isOpen ? `
      <div class="adetail" style="max-height:none;">
        <div class="adetail-inner has-pdf">
          <div class="rail">${railTicks}</div>
          <div class="adetail-body">
            <div class="question-block">
              <div class="qlabel">Question · ${a.directive} · ${a.marks}/${a.max} marks</div>
              <div class="question-text serif">${a.question}</div>
              <div class="demand-list">${demandListHtml}</div>
            </div>

            ${structureHtml}

            <div class="section">
              <div class="section-label">Best Introduction</div>
              <div class="callout serif">${a.bestIntro}</div>
            </div>

            <div class="grid2">
              <div class="section" style="margin-top:0;">
                <div class="section-label">Value Additions</div>
                <ul class="bullet-list">${a.valueAdditions.map(v=>`<li>${formatDash(v)}</li>`).join('')}</ul>
              </div>
              <div class="section" style="margin-top:0;">
                <div class="section-label">Examples / Data</div>
                <ul class="bullet-list">${a.examples.map(v=>`<li>${formatDash(v)}</li>`).join('')}</ul>
              </div>
            </div>

            <div class="section">
              <div class="section-label">Essential Keywords</div>
              <div class="chip-row">${a.keywords.map(k=>`<div class="kw-chip">${k}</div>`).join('')}</div>
            </div>

            <div class="section">
              <div class="section-label">Best Conclusion</div>
              <div class="callout serif">${a.bestConclusion}</div>
            </div>

            <div class="section">
              <div class="section-label">Missing / Extra — Improvements</div>
              <div class="ink-note">
                ${a.improvements.map(im=>`<div class="in-row"><span class="strike">${im.issue}</span><span class="arrow-fix">→ ${im.fix}</span></div>`).join('')}
              </div>
            </div>

            <div class="section topper-edge">
              <div class="section-label">Topper Edge</div>
              <div class="tebox">${a.topperEdge}</div>
            </div>

            <div class="section">
              <div class="section-label">Overall Feedback</div>
              <div class="feedback-box">
                <div class="fb-cell strength"><div class="fb-k">Strength</div><div class="fb-v">${a.feedback.strength}</div></div>
                <div class="fb-cell gap"><div class="fb-k">Gap</div><div class="fb-v">${a.feedback.gap}</div></div>
                <div class="fb-cell fix"><div class="fb-k">Fix</div><div class="fb-v">${a.feedback.fix}</div></div>
              </div>
            </div>

            <div class="learning-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4.5L6 21l1.5-7.5L2 9h7z"/></svg>
              <div><b>My One Learning —</b> ${a.learning}</div>
            </div>

            <div class="afooter">
              <div class="pdfmeta">PDF · ${a.pdfDate}</div>
              <div class="status-chip">${a.status}</div>
            </div>
          </div>
          <div class="adetail-resizer" title="Drag to resize"></div>
          ${a.pdfId ? `
          <div class="adetail-pdf">
            <div class="adetail-pdf-head">
              <span>Answer PDF</span>
              <a href="https://drive.google.com/file/d/${a.pdfId}/view" target="_blank" rel="noopener">Open full ↗</a>
            </div>
            <iframe src="https://drive.google.com/file/d/${a.pdfId}/preview" loading="lazy" allow="autoplay"></iframe>
          </div>` : `
          <div class="adetail-pdf">
            <div class="adetail-pdf-head"><span>Answer PDF</span></div>
            <div class="adetail-pdf-empty">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6"/></svg>
              <div>No PDF ID found for this answer.</div>
            </div>
          </div>`}
        </div>
      </div>` : '';

    return `<div class="acard ${isOpen?'open':''}" data-id="${id}">
      <div class="arow" data-toggle="${id}">
        <div class="ptag" style="background:${col}1a;color:${col};">${a.paper}</div>
        <div class="arow-main">
          <div class="arow-title">${a.subtopic}</div>
          <div class="arow-sub"><span>${a.subject}</span><span class="sep">·</span><span>${d}</span></div>
        </div>
        <div class="demandmini">
          <div class="bar"><div style="width:${a.demandPct}%;background:${col};"></div></div>
          <div class="pct">${a.demandPct}% demand</div>
        </div>
        <div class="medal-mini" title="${a.tier.label}"><img src="${a.tier.img}" alt="${a.tier.label}"></div>
        <div class="scorebadge" style="background:${scoreBg};color:${scoreColor};">${score.toFixed(1)}<span class="of10">/ 10</span></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      ${detailHtml}
    </div>`;
  }).join('');

  listEl.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.toggle;
      if(openIds.has(id)) openIds.delete(id); else openIds.add(id);
      render();
    });
  });
}

function formatDash(text){
  // splits "Title — description" into bold title + rest
  const idx = text.indexOf('—');
  if(idx===-1) return text;
  return `<b>${text.slice(0,idx).trim()}</b> — ${text.slice(idx+1).trim()}`;
}

render();
if(deepLinkId){
  const target = document.querySelector(`.acard[data-id="${deepLinkId}"]`);
  if(target) setTimeout(()=> target.scrollIntoView({behavior:'smooth', block:'center'}), 150);
}

/* ---------- resizable PDF panel — drag the handle between feedback and PDF ----------
   Uses event delegation on document (not the resizer elements directly) since every
   expanded row's markup, resizer included, gets destroyed and recreated on each
   render() call. Width persists across reopens/sessions via localStorage. */
const PDF_WIDTH_KEY = 'answeros_pdf_panel_width_v1';
(function(){
  const saved = localStorage.getItem(PDF_WIDTH_KEY);
  if(saved) document.documentElement.style.setProperty('--pdf-panel-width', saved+'px');
})();
let resizing = null;
document.addEventListener('mousedown', (e)=>{
  const handle = e.target.closest('.adetail-resizer');
  if(!handle) return;
  e.preventDefault();
  const pdfPanel = handle.nextElementSibling;
  resizing = { handle, startX: e.clientX, startWidth: pdfPanel.getBoundingClientRect().width };
  handle.classList.add('dragging');
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', (e)=>{
  if(!resizing) return;
  const delta = resizing.startX - e.clientX; // dragging left = wider PDF panel
  const newWidth = Math.max(320, Math.min(900, Math.round(resizing.startWidth + delta)));
  document.documentElement.style.setProperty('--pdf-panel-width', newWidth+'px');
});
document.addEventListener('mouseup', ()=>{
  if(!resizing) return;
  resizing.handle.classList.remove('dragging');
  document.body.style.userSelect = '';
  const finalWidth = getComputedStyle(document.documentElement).getPropertyValue('--pdf-panel-width').trim();
  if(finalWidth) localStorage.setItem(PDF_WIDTH_KEY, parseInt(finalWidth));
  resizing = null;
});
</script>

<script>
// AnswerOS shared data bootstrap: cached data renders immediately, then the Sheet is synced.
AnswerOSData.initPage({reloadOnChange:true});
</script>
