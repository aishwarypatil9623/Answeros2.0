<!DOCTYPE html>
<html lang="en">
<head>
<script src="answeros-initial-data.js"></script>
<script src="answeros-data.js"></script>
<meta charset="UTF-8" />
<title>AnswerOS — Mentor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#1f7a3d;--green2:#14532d;--green50:#f3faf5;--green100:#e6f4ea;--ink:#14171a;--muted:#6b7278;--line:#e7eae8;--bg:#f6f8f6;--card:#fff;--red:#b3402c;--amber:#c98a1f;--shadow:0 1px 2px rgba(20,23,26,.04),0 6px 20px rgba(20,23,26,.05)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px}.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;min-width:1080px}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 22px}.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,#2c8a46,#14532d);display:grid;place-items:center;color:#fff}.name{font-weight:700;font-size:15px}.sub{font-size:11px;color:var(--muted);margin-top:2px}nav{display:flex;flex-direction:column;gap:2px}.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#3c4247;font-size:13.5px;font-weight:500;text-decoration:none}.nav-item:hover{background:var(--green50)}.nav-item.active{background:var(--green100);color:var(--green2);font-weight:700}.nav-spacer{flex:1}.side-foot{border-top:1px solid var(--line);padding-top:14px}.user{display:flex;gap:10px;align-items:center;padding:6px 8px}.avatar{width:34px;height:34px;border-radius:50%;background:#e0a0b1;color:#fff;display:grid;place-items:center;font-weight:800}.role{font-size:11px;color:var(--muted)}main{padding:28px 32px 70px;max-width:1450px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.head h1{font-size:26px;margin:0 0 5px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted);font-size:12.5px}.status{padding:7px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-top:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.diagnosis{font-family:"Source Serif 4",Georgia,serif;font-size:24px;line-height:1.28;margin:8px 0 10px}.message{font-size:13px;line-height:1.65;color:#3c4247}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.chip{padding:5px 8px;border-radius:7px;background:var(--green50);color:var(--green2);font-size:10.5px;font-weight:700}.chip.red{background:#fbf1ee;color:#7a3226}.section{margin-top:16px}.section h3{font-size:13px;margin:0 0 9px}.evidence{display:flex;flex-direction:column;gap:8px}.evidence div{padding:10px 12px;background:#fafbfa;border:1px solid var(--line);border-radius:9px;font-size:11.5px;line-height:1.5}.intervention{background:var(--green50);border:1px solid var(--green100);border-radius:10px;padding:14px}.intervention strong{display:block;font-size:13px;margin-bottom:4px}.metric{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:8px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric b{font-size:12px}.empty{padding:35px 10px;text-align:center;color:var(--muted);font-size:12px}.action{margin-top:14px;padding:9px 12px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.small{font-size:10.5px;color:var(--muted);line-height:1.5}
@media(max-width:900px){.app{grid-template-columns:1fr;min-width:0}.sidebar{display:none}.grid{grid-template-columns:1fr}main{padding:20px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">✦</div><div><div class="name">AnswerOS</div><div class="sub">Answer Writing Tracker</div></div></div><nav id="nav"></nav><div class="nav-spacer"></div><div class="side-foot"><div class="user"><div class="avatar">AP</div><div><b>Aishwary Patil</b><div class="role">UPSC Aspirant</div></div></div></div></aside>
<main><div class="head"><div><div class="eyebrow">Longitudinal Mentor</div><h1>Your Mentor</h1><p>Not another scorecard. A running diagnosis of what is actually moving your marks.</p></div><div class="status" id="status">Loading mentor state…</div></div>
<div id="root" class="grid"></div>
<div class="card section" id="historyCard"><div class="eyebrow">Intervention history</div><div id="history" class="empty">No mentor history has been written yet.</div></div>
</main></div>
<script>
const NAV=[['Dashboard','answeros-dashboard.html'],['All Answers','answeros-all-answers.html'],['Analytics','answeros-analytics.html'],['PYQ Tracker','answeros-pyq-tracker.html'],['Learnings','answeros-learnings.html'],['Notes','answeros-notes.html'],['Revision Hub','answeros-revision-hub.html'],['Flashcards','answeros-flashcards.html'],['Calendar','answeros-calendar.html'],['Goals','answeros-goals.html'],['Mentor','answeros-mentor.html'],['Settings','answeros-settings.html']];
document.getElementById('nav').innerHTML=NAV.map(([x,h])=>`<a class="nav-item ${x==='Mentor'?'active':''}" href="${h}">${x}</a>`).join('');
const demo={status:'not_connected',diagnosis:{primary_issue:'Mentor backend not connected yet.',severity:'setup',confidence:1,evidence:['AnswerOS data layer is available locally.','The mentor page is ready to consume persistent Mentor State.']},progress:{current_strength:'Your existing analytics already capture score, demand, directive, gaps and word count.',improving:[],stagnant:[]},intervention:{action:'Connect the Apps Script mentor bridge to Antigravity.',duration:'setup',success_metric:'A new evaluated answer produces a Mentor State update.'},do_not_do:['Do not expose a Gemini API key in browser JavaScript.','Do not let the agent replace deterministic AnswerOS calculations.'],mentor_message:'Once connected, I will diagnose patterns across your answers rather than give generic advice.'};
function render(s){const d=s.diagnosis||{};const p=s.progress||{};const i=s.intervention||{};document.getElementById('status').textContent=s.status==='ready'?'Updated mentor state':'Setup required';document.getElementById('root').innerHTML=`<section class="card"><div class="eyebrow">Current diagnosis</div><div class="diagnosis">${esc(d.primary_issue||'No diagnosis yet.')}</div><div class="message">${esc(s.mentor_message||'')}</div><div class="chips"><span class="chip">Severity: ${esc(d.severity||'—')}</span><span class="chip">Confidence: ${Math.round((Number(d.confidence)||0)*100)}%</span></div><div class="section"><h3>Evidence</h3><div class="evidence">${(d.evidence||[]).map(x=>`<div>${esc(x)}</div>`).join('')||'<div>No evidence recorded.</div>'}</div></div></section><section class="card"><div class="eyebrow">Current intervention</div><div class="intervention"><strong>${esc(i.action||'None')}</strong><div class="small">Review after: ${esc(i.duration||'—')}</div><div class="small">Success metric: ${esc(i.success_metric||'—')}</div></div><div class="section"><h3>Progress</h3><div class="metric"><span>Current strength</span><b>${esc(p.current_strength||'—')}</b></div><div class="metric"><span>Improving</span><b>${(p.improving||[]).length}</b></div><div class="metric"><span>Stagnant</span><b>${(p.stagnant||[]).length}</b></div></div><div class="section"><h3>What to stop doing</h3><div class="evidence">${(s.do_not_do||[]).map(x=>`<div>${esc(x)}</div>`).join('')||'<div>Nothing flagged.</div>'}</div></div></section>`}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
render(demo);
// The production bridge will replace this bootstrap with a GET action=mentor_state response.
(async function(){try{const c=AnswerOSData.getConfig();if(!c.syncUrl)return;const u=new URL(c.syncUrl);u.searchParams.set('action','mentor_state');u.searchParams.set('_ts',Date.now());const r=await fetch(u.toString(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j&&j.ok&&j.state){render(j.state)}}catch(e){console.warn('[AnswerOS Mentor]',e)}})();
</script></body></html>
